name: Sync URA Carpark Data

on:
  schedule:
    - cron: '0 * * * *'  # Hourly at minute 0
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call URA sync API
        run: |
          curl -X POST "https://erpsaver-backend.onrender.com/api/v1/carparks/sync/ura" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            --fail || echo "Sync failed"