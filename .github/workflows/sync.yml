name: Sync Carpark Data

on:
  schedule:
    - cron: '0 * * * *'  # Hourly at minute 0
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync URA carpark catalog
        run: |
          curl -X POST "https://erpsaver-backend.onrender.com/api/v1/carparks/sync/ura" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            --fail
      - name: Sync LTA and HDB carparks
        run: |
          curl -X POST "https://erpsaver-backend.onrender.com/api/v1/carparks/sync/lta" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            --fail
